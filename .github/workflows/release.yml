name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z (must match TOC)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME -replace '^v','' }
          ./scripts/build.ps1 -Version $version
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG dist/GAPerGuide.zip dist/GAPerUpdater.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "GAPerGuide $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
